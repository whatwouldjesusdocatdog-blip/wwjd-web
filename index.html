<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WWJD — What Would Jesus Do?</title>
  <meta name="description" content="Daily Bible verses, AI-powered devotionals, and spiritual guidance. WWJD brings Scripture to life on your iPhone." />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ── Tokens ── */
    :root {
      --gold:       #D9B359;
      --gold-light: #F0D48A;
      --gold-faint: #FBF4E0;
      --brown:      #402608;
      --cream:      #FAF5E5;
      --parchment:  #F2E8CC;
      --text:       #2D1A06;
      --muted:      #7A6040;
      --muted-lt:   #B09878;
      --radius:     14px;
      --radius-lg:  20px;
      --shadow-lg:  0 24px 64px rgba(64,38,8,0.18);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      max-width: 1100px;
      margin: 0 auto;
    }
    .nav-logo {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      color: var(--brown);
      letter-spacing: 0.03em;
    }
    .nav-logo span { color: var(--gold); }
    .app-store-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brown);
      color: var(--cream);
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .app-store-btn:hover { background: #5c3810; }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 80px 5% 60px;
      max-width: 780px;
      margin: 0 auto;
    }
    .hero-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.15;
      color: var(--brown);
      margin-bottom: 20px;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--gold);
    }
    .hero p {
      font-size: clamp(16px, 2vw, 19px);
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 36px;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold);
      color: var(--brown);
      text-decoration: none;
      padding: 15px 32px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(217,179,89,0.35);
    }
    .hero-cta:hover { background: var(--gold-light); transform: translateY(-2px); }

    /* ── Verse card ── */
    .verse-card {
      background: var(--parchment);
      border-radius: var(--radius);
      padding: 28px 32px;
      max-width: 620px;
      margin: 56px auto 0;
      text-align: left;
      box-shadow: 0 6px 24px rgba(64,38,8,0.08);
    }
    .verse-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .verse-text {
      font-family: Georgia, serif;
      font-size: 20px;
      font-style: italic;
      line-height: 1.7;
      color: var(--brown);
      margin-bottom: 12px;
    }
    .verse-ref {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
    }

    /* ── Features ── */
    .features {
      padding: 80px 5%;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .features h2 {
      font-family: Georgia, serif;
      font-size: clamp(28px, 4vw, 42px);
      color: var(--brown);
      margin-bottom: 48px;
      max-width: 480px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .feature-card {
      background: white;
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(64,38,8,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .feature-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(64,38,8,0.10); }
    .feature-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--parchment);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    .feature-card h3 {
      font-family: Georgia, serif;
      font-size: 18px;
      color: var(--brown);
      margin-bottom: 8px;
    }
    .feature-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Quote strip ── */
    .quote-strip {
      background: var(--brown);
      color: var(--parchment);
      text-align: center;
      padding: 64px 5%;
    }
    .quote-strip blockquote {
      font-family: Georgia, serif;
      font-size: clamp(20px, 3vw, 30px);
      font-style: italic;
      max-width: 700px;
      margin: 0 auto 16px;
      line-height: 1.6;
    }
    .quote-strip cite {
      font-size: 14px;
      color: var(--gold);
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    /* ── CTA section ── */
    .cta-section {
      text-align: center;
      padding: 80px 5%;
      max-width: 600px;
      margin: 0 auto;
    }
    .cta-section h2 {
      font-family: Georgia, serif;
      font-size: clamp(26px, 4vw, 38px);
      color: var(--brown);
      margin-bottom: 16px;
    }
    .cta-section p {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--parchment);
      padding: 28px 5%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--brown); }

    /* ── Auth callback pages ── */
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 5% 80px;
      background: linear-gradient(160deg, var(--cream) 0%, var(--gold-faint) 100%);
    }
    .auth-card {
      background: #fff;
      border: 1px solid rgba(217,179,89,0.22);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 52px 48px 44px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    /* Animated checkmark */
    .check-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
    }
    .check-ring .check-bg {
      fill: var(--gold-faint);
      stroke: none;
    }
    .check-ring .check-arc {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3;
      stroke-dasharray: 226;
      stroke-dashoffset: 226;
      animation: ring-draw 0.65s cubic-bezier(0.4,0,0.2,1) 0.1s forwards;
      transform-origin: 40px 40px;
      transform: rotate(-90deg);
    }
    .check-ring polyline {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: check-draw 0.4s cubic-bezier(0.4,0,0.2,1) 0.65s forwards;
    }
    @keyframes ring-draw  { to { stroke-dashoffset: 0; } }
    @keyframes check-draw { to { stroke-dashoffset: 0; } }
    .auth-card h1 {
      font-family: Georgia, serif;
      font-size: clamp(26px, 4vw, 34px);
      color: var(--brown);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .auth-card .auth-sub {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .open-app-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--gold);
      color: var(--brown);
      text-decoration: none;
      padding: 15px 34px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 22px rgba(217,179,89,0.42);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    .open-app-btn:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(217,179,89,0.48); }
    .auth-redirect-note {
      font-size: 12px;
      color: var(--muted-lt);
      margin-bottom: 28px;
      min-height: 18px;
    }
    .auth-redirect-note strong { color: var(--muted); }
    .auth-verse {
      border-top: 1px solid var(--parchment);
      padding-top: 24px;
    }
    .auth-verse blockquote {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 6px;
    }
    .auth-verse cite {
      font-size: 12px;
      font-style: normal;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .auth-download-hint {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted-lt);
    }
    .auth-download-hint a {
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-download-hint a:hover { text-decoration: underline; }
    .auth-footer {
      border-top: 1px solid var(--parchment);
      padding: 20px;
      text-align: center;
      color: var(--muted-lt);
      font-size: 12px;
    }

    /* ── Loading state ── */
    .auth-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 16px;
    }
    .auth-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--parchment);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-loading p { font-size: 14px; color: var(--muted); }

    /* ── Password reset form ── */
    .auth-form { margin-top: 4px; text-align: left; }
    .auth-field { margin-bottom: 16px; }
    .auth-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .auth-field input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e8dfc8;
      border-radius: var(--radius);
      font-size: 15px;
      background: var(--cream);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .auth-field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217,179,89,0.15);
    }
    .auth-error-msg {
      background: #fff5f2;
      border: 1px solid #f4b8a5;
      border-radius: 10px;
      padding: 10px 14px;
      color: #8b3520;
      font-size: 13px;
      margin-bottom: 14px;
      text-align: left;
    }
    .auth-submit {
      width: 100%;
      background: var(--gold);
      color: var(--brown);
      border: none;
      padding: 15px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(217,179,89,0.42);
      transition: background 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .auth-submit:hover:not(:disabled) { background: var(--gold-light); transform: translateY(-2px); }
    .auth-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 0;
      color: var(--muted-lt);
      font-size: 12px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--parchment);
    }
    .open-app-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
    }
    .open-app-link:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .auth-card { padding: 40px 24px 36px; }
    }
    @media (max-width: 600px) {
      nav { flex-direction: column; gap: 14px; }
      .hero { padding: 48px 5% 40px; }
      .verse-card { margin-top: 36px; padding: 20px; }
    }
  </style>
</head>

    // ─── Page renderers ──────────────────────────────────────────

    function renderLanding() {
      document.getElementById('page-content').innerHTML = `
        <section class="hero">
          <div class="hero-tag">Now Available on iPhone</div>
          <h1>What Would<br><em>Jesus Do?</em></h1>

    function renderEmailConfirmed() {
      const link = deepLink();
      document.getElementById('page-content').innerHTML = `
        <div class="auth-page">
          <div class="auth-card">

            <svg class="check-ring" viewBox="0 0 80 80" aria-hidden="true">

    function renderPasswordResetForm(sb) {

      document.getElementById('page-content').innerHTML = `

                <input type="password" id="pw-confirm" placeholder="Repeat your new password" autocomplete="new-password" />
              </div>
              <button class="auth-submit" id="reset-submit" type="submit">Update Password</button>
            </form>

            <div class="or-divider">or</div>
            <a href="${link}" class="open-app-link">${appleIcon}&nbsp;Open in WWJD App (iPhone)</a>

            <div class="auth-verse" style="margin-top:24px">
              <blockquote>"Create in me a pure heart, O God, and renew a steadfast spirit within me."</blockquote>
              <cite>Psalm 51:10</cite>
            </div>

          </div>
        </div>
        <div class="auth-footer">© ${new Date().getFullYear()} WWJD &middot; Made with faith.</div>
      `;

      const errorEl   = document.getElementById('auth-error');
      const submitBtn = document.getElementById('reset-submit');

      document.getElementById('reset-form').addEventListener('submit', async () => {
        const pw  = document.getElementById('pw-new').value;
        const cpw = document.getElementById('pw-confirm').value;

        errorEl.style.display = 'none';

        if (pw.length < 8) {
          errorEl.textContent = 'Password must be at least 8 characters.';
          errorEl.style.display = 'block';
          return;
        }
        if (pw !== cpw) {
          errorEl.textContent = 'Passwords do not match.';
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating\u2026';

        const { error: updErr } = await sb.auth.updateUser({ password: pw });

        if (updErr) {
          errorEl.textContent = updErr.message || 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }

        // Success
        document.getElementById('page-content').innerHTML = `
          <div class="auth-page">
            <div class="auth-card">
              <svg class="check-ring" viewBox="0 0 80 80" aria-hidden="true">
                <circle class="check-bg" cx="40" cy="40" r="36"/>
                <circle class="check-arc" cx="40" cy="40" r="36"/>
                <polyline points="24,41 35,52 56,30"/>
              </svg>
              <h1>Password Updated!</h1>
              <p class="auth-sub">Your password has been changed. Open the WWJD app to sign in with your new password.</p>
              <a href="${link}" class="open-app-btn">${appleIcon} Open the WWJD App</a>
              <div class="auth-verse" style="margin-top:20px">
                <blockquote>"His mercies are new every morning."</blockquote>
                <cite>Lamentations 3:23</cite>
              </div>
            </div>
          </div>
          <div class="auth-footer">© ${new Date().getFullYear()} WWJD &middot; Made with faith.</div>
        `;
      });
    }

    async function initAndRoute() {
      showLoading();

      const { createClient } = window.supabase;
      const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { flowType: 'pkce' }
      });

      // Guard against the auth-state listener firing multiple times
      let routed = false;
      const routeTo = (fn) => { if (!routed) { routed = true; fn(); } };

      // Listen BEFORE exchanging so we catch the event
      sb.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') routeTo(() => renderPasswordResetForm(sb));
        else if (event === 'SIGNED_IN')     routeTo(renderEmailConfirmed);
      });

      if (code) {
        const { error: exchErr } = await sb.auth.exchangeCodeForSession(code);
        if (exchErr) {
          routeTo(() => renderLinkExpired(exchErr.code || 'invalid'));
        } else if (!routed) {
          // Exchange succeeded but no auth event fired — shouldn't happen,
          // but fall back gracefully
          routeTo(renderEmailConfirmed);
        }
      } else if (hashParams.get('access_token')) {
        // Implicit-flow tokens — setSession fires SIGNED_IN regardless of type,
        // so use the type param from the URL directly instead of the auth event.
        const { error: sessErr } = await sb.auth.setSession({
          access_token: hashParams.get('access_token'),
          refresh_token: hashParams.get('refresh_token') || ''
        });
        if (sessErr) {
          routeTo(() => renderLinkExpired('invalid'));
        } else if (type === 'recovery') {
          routeTo(() => renderPasswordResetForm(sb));
        } else {
          routeTo(renderEmailConfirmed);
        }
      }
    }

    function renderLinkExpired(errorCode) {
      const isExpired = !errorCode || errorCode === 'otp_expired';
      const heading   = isExpired ? 'Link Expired'      : 'Link Invalid';
      const message   = isExpired
        ? 'This confirmation link has expired. Email links are single-use and valid for a limited time. Open the app and sign in again to receive a fresh link.'
        : 'This confirmation link is invalid or has already been used. Open the app and sign in again to receive a new one.';

      document.getElementById('page-content').innerHTML = `
        <div class="auth-page">
          <div class="auth-card">

            <svg class="check-ring" viewBox="0 0 80 80" aria-hidden="true">
              <circle class="check-bg" cx="40" cy="40" r="36"/>
              <circle class="check-arc" cx="40" cy="40" r="36" style="stroke:#c0763a"/>
              <line x1="28" y1="28" x2="52" y2="52" stroke="#c0763a" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="34" stroke-dashoffset="34"
                style="animation:check-draw 0.4s cubic-bezier(0.4,0,0.2,1) 0.65s forwards"/>
              <line x1="52" y1="28" x2="28" y2="52" stroke="#c0763a" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="34" stroke-dashoffset="34"
                style="animation:check-draw 0.4s cubic-bezier(0.4,0,0.2,1) 0.75s forwards"/>
            </svg>

            <h1 style="color:#7a3a10">${heading}</h1>
            <p class="auth-sub">${message}</p>

            <a href="${deepLink()}" class="open-app-btn">
              ${appleIcon} Open the WWJD App
            </a>

            <div class="auth-verse">
              <blockquote>"Ask and it will be given to you; seek and you will find."</blockquote>
              <cite>Matthew 7:7</cite>
            </div>

          </div>
        </div>
        <div class="auth-footer">© ${new Date().getFullYear()} WWJD &middot; Made with faith.</div>
      `;
    }

    // ─── Router ──────────────────────────────────────────────────
    if (error) {
      renderLinkExpired(errorCode);
    } else if (code || (type === 'recovery' && hashParams.get('access_token'))) {
      // Use the SDK to exchange the code and detect whether it's a
      // password recovery or an email confirmation — can't tell from URL alone.
      initAndRoute();
    } else if (type === 'signup' || type === 'email_change' || type === 'email') {
      renderEmailConfirmed();
    } else {
      renderLanding();
    }

    document.getElementById('nav-appstore-link').href = APPSTORE_URL;
  </script>

</body>
</html>
