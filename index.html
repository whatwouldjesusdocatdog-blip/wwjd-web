<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WWJD — What Would Jesus Do?</title>
  <meta name="description" content="Daily Bible verses, AI-powered devotionals, and spiritual guidance. WWJD brings Scripture to life on your iPhone." />
  <style>
    /* ── Tokens ── */
    :root {
      --gold:       #D9B359;
      --gold-light: #F0D48A;
      --gold-faint: #FBF4E0;
      --brown:      #402608;
      --cream:      #FAF5E5;
      --parchment:  #F2E8CC;
      --text:       #2D1A06;
      --muted:      #7A6040;
      --muted-lt:   #B09878;
      --radius:     14px;
      --radius-lg:  20px;
      --shadow-lg:  0 24px 64px rgba(64,38,8,0.18);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      max-width: 1100px;
      margin: 0 auto;
    }
    .nav-logo {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      color: var(--brown);
      letter-spacing: 0.03em;
    }
    .nav-logo span { color: var(--gold); }
    .app-store-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brown);
      color: var(--cream);
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .app-store-btn:hover { background: #5c3810; }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 80px 5% 60px;
      max-width: 780px;
      margin: 0 auto;
    }
    .hero-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.15;
      color: var(--brown);
      margin-bottom: 20px;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--gold);
    }
    .hero p {
      font-size: clamp(16px, 2vw, 19px);
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 36px;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold);
      color: var(--brown);
      text-decoration: none;
      padding: 15px 32px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(217,179,89,0.35);
    }
    .hero-cta:hover { background: var(--gold-light); transform: translateY(-2px); }

    /* ── Verse card ── */
    .verse-card {
      background: var(--parchment);
      border-radius: var(--radius);
      padding: 28px 32px;
      max-width: 620px;
      margin: 56px auto 0;
      text-align: left;
      box-shadow: 0 6px 24px rgba(64,38,8,0.08);
    }
    .verse-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .verse-text {
      font-family: Georgia, serif;
      font-size: 20px;
      font-style: italic;
      line-height: 1.7;
      color: var(--brown);
      margin-bottom: 12px;
    }
    .verse-ref {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
    }

    /* ── Features ── */
    .features {
      padding: 80px 5%;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .features h2 {
      font-family: Georgia, serif;
      font-size: clamp(28px, 4vw, 42px);
      color: var(--brown);
      margin-bottom: 48px;
      max-width: 480px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .feature-card {
      background: white;
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(64,38,8,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .feature-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(64,38,8,0.10); }
    .feature-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--parchment);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    .feature-card h3 {
      font-family: Georgia, serif;
      font-size: 18px;
      color: var(--brown);
      margin-bottom: 8px;
    }
    .feature-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Quote strip ── */
    .quote-strip {
      background: var(--brown);
      color: var(--parchment);
      text-align: center;
      padding: 64px 5%;
    }
    .quote-strip blockquote {
      font-family: Georgia, serif;
      font-size: clamp(20px, 3vw, 30px);
      font-style: italic;
      max-width: 700px;
      margin: 0 auto 16px;
      line-height: 1.6;
    }
    .quote-strip cite {
      font-size: 14px;
      color: var(--gold);
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    /* ── CTA section ── */
    .cta-section {
      text-align: center;
      padding: 80px 5%;
      max-width: 600px;
      margin: 0 auto;
    }
    .cta-section h2 {
      font-family: Georgia, serif;
      font-size: clamp(26px, 4vw, 38px);
      color: var(--brown);
      margin-bottom: 16px;
    }
    .cta-section p {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--parchment);
      padding: 28px 5%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--brown); }

    /* ── Auth callback pages ── */
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 5% 80px;
      background: linear-gradient(160deg, var(--cream) 0%, var(--gold-faint) 100%);
    }
    .auth-card {
      background: #fff;
      border: 1px solid rgba(217,179,89,0.22);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 52px 48px 44px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    /* Animated checkmark */
    .check-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
    }
    .check-ring .check-bg {
      fill: var(--gold-faint);
      stroke: none;
    }
    .check-ring .check-arc {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3;
      stroke-dasharray: 226;
      stroke-dashoffset: 226;
      animation: ring-draw 0.65s cubic-bezier(0.4,0,0.2,1) 0.1s forwards;
      transform-origin: 40px 40px;
      transform: rotate(-90deg);
    }
    .check-ring polyline {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: check-draw 0.4s cubic-bezier(0.4,0,0.2,1) 0.65s forwards;
    }
    @keyframes ring-draw  { to { stroke-dashoffset: 0; } }
    @keyframes check-draw { to { stroke-dashoffset: 0; } }
    .auth-card h1 {
      font-family: Georgia, serif;
      font-size: clamp(26px, 4vw, 34px);
      color: var(--brown);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .auth-card .auth-sub {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .open-app-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--gold);
      color: var(--brown);
      text-decoration: none;
      padding: 15px 34px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 22px rgba(217,179,89,0.42);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    .open-app-btn:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(217,179,89,0.48); }
    .auth-redirect-note {
      font-size: 12px;
      color: var(--muted-lt);
      margin-bottom: 28px;
      min-height: 18px;
    }
    .auth-redirect-note strong { color: var(--muted); }
    .auth-verse {
      border-top: 1px solid var(--parchment);
      padding-top: 24px;
    }
    .auth-verse blockquote {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 6px;
    }
    .auth-verse cite {
      font-size: 12px;
      font-style: normal;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .auth-download-hint {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted-lt);
    }
    .auth-download-hint a {
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-download-hint a:hover { text-decoration: underline; }
    .auth-footer {
      border-top: 1px solid var(--parchment);
      padding: 20px;
      text-align: center;
      color: var(--muted-lt);
      font-size: 12px;
    }
    @media (max-width: 560px) {
      .auth-card { padding: 40px 24px 36px; }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      nav { flex-direction: column; gap: 14px; }
      .hero { padding: 48px 5% 40px; }
      .verse-card { margin-top: 36px; padding: 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">WWJD<span>.</span></div>
    <a href="#" class="app-store-btn" id="nav-appstore-link">
      &#xf8ff; Download on the App Store
    </a>
  </nav>

  <div id="page-content"></div>

  <script>
    // ─── Config — update these when the app goes live ───
    const APPSTORE_URL = '#'; // Replace with App Store link
    const APP_SCHEME   = 'wwjd://login-callback';
    // ────────────────────────────────────────────────────

    const hash         = window.location.hash.substring(1);
    const hashParams   = new URLSearchParams(hash);
    const queryParams  = new URLSearchParams(window.location.search);
    const type         = hashParams.get('type');
    const code         = queryParams.get('code');
    const error        = queryParams.get('error') || hashParams.get('error');
    const errorCode    = queryParams.get('error_code') || hashParams.get('error_code');

    function deepLink() {
      // Forward both hash and query params to the app so it can exchange the code
      const qs = window.location.search;
      return APP_SCHEME + (qs ? qs : '') + (hash ? '#' + hash : '');
    }

    const appleIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
    </svg>`;

    function renderLanding() {
      document.getElementById('page-content').innerHTML = `
        <section class="hero">
          <div class="hero-tag">Now Available on iPhone</div>
          <h1>What Would<br><em>Jesus Do?</em></h1>
          <p>Daily Bible verses, AI-powered devotionals, and a space to explore your faith — one question at a time.</p>
          <a href="${APPSTORE_URL}" class="hero-cta">${appleIcon} Download Free</a>
          <div class="verse-card">
            <div class="verse-label">✦ Verse of the Day</div>
            <div class="verse-text">"I can do all things through Christ who strengthens me."</div>
            <div class="verse-ref">— Philippians 4:13 (NIV)</div>
          </div>
        </section>

        <section class="features">
          <div class="section-label">✦ What's Inside</div>
          <h2>Everything you need to grow in faith.</h2>
          <div class="features-grid">
            <div class="feature-card">
              <div class="feature-icon">📖</div>
              <h3>Bible Reader</h3>
              <p>Read Scripture in multiple translations with clean, distraction-free typography.</p>
            </div>
            <div class="feature-card">
              <div class="feature-icon">✝️</div>
              <h3>Ask WWJD</h3>
              <p>Have a real conversation about your faith, struggles, and questions — guided by Scripture.</p>
            </div>
            <div class="feature-card">
              <div class="feature-icon">☀️</div>
              <h3>Daily Verse</h3>
              <p>Start each morning with a verse, devotional, and reflection question curated for the day.</p>
            </div>
            <div class="feature-card">
              <div class="feature-icon">🔖</div>
              <h3>Saved Verses</h3>
              <p>Bookmark passages that speak to you and add personal notes to revisit anytime.</p>
            </div>
          </div>
        </section>

        <div class="quote-strip">
          <blockquote>"Your word is a lamp to my feet and a light to my path."</blockquote>
          <cite>— Psalm 119:105</cite>
        </div>

        <section class="cta-section">
          <h2>Begin your daily walk with Scripture.</h2>
          <p>Free to download. No subscription required to read the Bible.</p>
          <a href="${APPSTORE_URL}" class="hero-cta">${appleIcon} Get the App</a>
        </section>

        <footer>
          <span>© ${new Date().getFullYear()} WWJD. Made with faith.</span>
          <a href="mailto:support@wwjdapp.com">Support</a>
        </footer>
      `;
    }

    function renderEmailConfirmed() {
      const link = deepLink();
      document.getElementById('page-content').innerHTML = `
        <div class="auth-page">
          <div class="auth-card">

            <svg class="check-ring" viewBox="0 0 80 80" aria-hidden="true">
              <circle class="check-bg" cx="40" cy="40" r="36"/>
              <circle class="check-arc" cx="40" cy="40" r="36"/>
              <polyline points="24,41 35,52 56,30"/>
            </svg>

            <h1>Email Confirmed!</h1>
            <p class="auth-sub">
              You're all set. Your WWJD account is verified and ready to go.
              Open the app on your iPhone to begin your daily walk with Scripture.
            </p>

            <a href="${link}" class="open-app-btn" id="open-app-link">
              ${appleIcon} Open the WWJD App
            </a>

            <p class="auth-redirect-note" id="redirect-note">
              Opening automatically in <strong id="countdown">5</strong>s&hellip;
            </p>

            <div class="auth-verse">
              <blockquote>
                "Therefore, if anyone is in Christ, the new creation has come:
                the old has gone, the new is here!"
              </blockquote>
              <cite>2 Corinthians 5:17</cite>
            </div>

            <p class="auth-download-hint">
              Don't have the app yet?
              <a href="${APPSTORE_URL}">Download it on the App Store.</a>
            </p>

          </div>
        </div>
        <div class="auth-footer">© ${new Date().getFullYear()} WWJD &middot; Made with faith.</div>
      `;

      /* Auto-open countdown */
      let secs = 5;
      const countEl = document.getElementById('countdown');
      const noteEl  = document.getElementById('redirect-note');
      const timer = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(timer);
          noteEl.textContent = 'Redirecting\u2026';
          window.location.href = link;
        } else {
          countEl.textContent = secs;
        }
      }, 1000);

      /* Cancel auto-redirect if user clicks manually */
      document.getElementById('open-app-link').addEventListener('click', () => {
        clearInterval(timer);
        noteEl.textContent = '';
      });
    }

    function renderPasswordReset() {
      document.getElementById('page-content').innerHTML = `
        <section class="auth-hero">
          <div class="auth-icon">🔑</div>
          <h1>Reset Your Password</h1>
          <p>Tap the button below to open the WWJD app and set a new password for your account.</p>
          <a href="${deepLink()}" class="open-app-btn">Open WWJD to Reset Password</a>
          <p style="margin-top:24px; font-size:13px; color:var(--muted)">
            Link not working?
            <a href="${APPSTORE_URL}" style="color:var(--gold); font-weight:600">Download the app first.</a>
          </p>
        </section>
        <div class="auth-footer">© ${new Date().getFullYear()} WWJD</div>
      `;
    }

    function renderLinkExpired(errorCode) {
      const isExpired = !errorCode || errorCode === 'otp_expired';
      const heading   = isExpired ? 'Link Expired'      : 'Link Invalid';
      const message   = isExpired
        ? 'This confirmation link has expired. Email links are single-use and valid for a limited time. Open the app and sign in again to receive a fresh link.'
        : 'This confirmation link is invalid or has already been used. Open the app and sign in again to receive a new one.';

      document.getElementById('page-content').innerHTML = `
        <div class="auth-page">
          <div class="auth-card">

            <svg class="check-ring" viewBox="0 0 80 80" aria-hidden="true">
              <circle class="check-bg" cx="40" cy="40" r="36"/>
              <circle class="check-arc" cx="40" cy="40" r="36" style="stroke:#c0763a"/>
              <line x1="28" y1="28" x2="52" y2="52" stroke="#c0763a" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="34" stroke-dashoffset="34"
                style="animation:check-draw 0.4s cubic-bezier(0.4,0,0.2,1) 0.65s forwards"/>
              <line x1="52" y1="28" x2="28" y2="52" stroke="#c0763a" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="34" stroke-dashoffset="34"
                style="animation:check-draw 0.4s cubic-bezier(0.4,0,0.2,1) 0.75s forwards"/>
            </svg>

            <h1 style="color:#7a3a10">${heading}</h1>
            <p class="auth-sub">${message}</p>

            <a href="${deepLink()}" class="open-app-btn">
              ${appleIcon} Open the WWJD App
            </a>

            <div class="auth-verse">
              <blockquote>"Ask and it will be given to you; seek and you will find."</blockquote>
              <cite>Matthew 7:7</cite>
            </div>

          </div>
        </div>
        <div class="auth-footer">© ${new Date().getFullYear()} WWJD &middot; Made with faith.</div>
      `;
    }

    // Route based on Supabase auth callback
    if (error) {
      renderLinkExpired(errorCode);
    } else if (code || type === 'signup' || type === 'email_change') {
      renderEmailConfirmed();
    } else if (type === 'recovery') {
      renderPasswordReset();
    } else {
      renderLanding();
    }

    document.getElementById('nav-appstore-link').href = APPSTORE_URL;
  </script>

</body>
</html>
